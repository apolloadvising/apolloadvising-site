name: site-check
on: push
permissions:
  contents: write
  pages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > result.txt 2>&1
          echo "== before"; gh api repos/${{ github.repository }}/pages || true
          echo "== health"; gh api repos/${{ github.repository }}/pages/health || true
          echo "== curl"; curl -sS -o /dev/null -w "%{http_code} ssl=%{ssl_verify_result}\n" https://www.apolloadvising.com/faq/ || true
          sleep 20
          echo "== after"; gh api repos/${{ github.repository }}/pages || true
      - run: |
          git config user.name "Apollo Advising"; git config user.email "denver@apolloadvising.com"
          git add result.txt; git commit -m "check result [skip ci]"; git push
